name: Deploy to RCade

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    name: Build and Deploy to RCade
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: ./*

      - name: Deploy to RCade
        uses: fcjr/rcade/action-deploy@main
        with:
          artifactPath: ./